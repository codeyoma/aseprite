    reply: "Wrong tool names — retrying with the aseprite prefix.\nI made the 6-frame `walk` cycle. It's in a new group, [AI: walk](aseprite://tag/walk), split into part layers: `far arm`, `far leg`, `body`, `near leg`, `near arm`. I hid your original [Hero](aseprite://layer/L7964) layer but didn't change it. The near limbs are lighter (light blue arm, grey-purple leg) and the far limbs are dark navy, so you can tell which side is closer. I used colors already in your palette.\n\n| Frame | Pose | Duration |\n|---|---|---|\n| 1 | Contact: near leg forward, near arm back | 120 ms |\n| 2 | Down: knees bend, body 1 px lower | 100 ms |\n| 3 | Passing: near leg straight under the body, far leg swings past, body 1 px higher | 100 ms |\n| 4 | Contact: legs swapped, near arm forward | 120 ms |\n| 5 | Down | 100 ms |\n| "
