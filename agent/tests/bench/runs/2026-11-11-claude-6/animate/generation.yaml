    reply: "Frame 10 shows a gap between head and body; I'll reorder the bob so the head never sits above the body.\nI added a 4-frame idle loop as frames 7–10, tagged [idle](aseprite://tag/idle). The character stands still with feet planted and arms at the sides, and moves only by a 1 px breathing bob. The pixels and timing of the 6 walk frames are unchanged. Adding frames briefly stretched the walk tag over the new frames too, so I set it back to frames 1–6.\n\n| Frame | Pose | Duration |\n|---|---|---|\n| 7 | at rest | 400 ms |\n| 8 | head drops 1 px | 200 ms |\n| 9 | head, body and arm 1 px down (exhale) | 350 ms |\n| 10 | body back up, head and arm still down; leads back into frame 7 | 200 ms |\n\nThe parts settle and recover one after another so the bob looks softer. The order also stops a gap opening bet"
