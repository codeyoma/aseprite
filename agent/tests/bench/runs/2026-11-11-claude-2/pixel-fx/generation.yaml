    reply: "Both were already in place from the last step, so I left them as they are:\n\n- **Hit-stop:** frame 4 is the impact frame, where the staff thrusts and the white flash appears. It lasts 160 ms instead of 100, a 60 ms freeze recorded on the sprite for export. Adding another would make it 120 ms, which starts to feel like a stall at 100 ms frames.\n- **Clean ending:** the effect check found no problems and no leftover pixels when it ends. The ring breaks into dots on frames 7–8 and is gone by frame 9, which is empty on both [effect](aseprite://layer/L2766) layers. The [glow](aseprite://layer/L2777) is already gone after frame 6.\n\nIf you want more punch, I can add a 2 px shake inside that freeze, or make the freeze longer (about 100 ms)."
