    reply: "Working on it: I found the thrust on frame 4, with the staff tip at (92, 60), and I'm now putting the nova there.\nThe effect started on frame 2, before the thrust, because the tool lines up the recipe's busiest moment rather than its start. I'm undoing it and starting it on frame 4.\nThis version fades by breaking the ring into dots instead of popping off. Applying it:\nI added a frost nova to the [attack](aseprite://tag/attack) tag. It bursts from the staff tip at (92, 60) on frame 4, the thrust frame where the mage lunges forward.\n\n**How it plays:**\n- **Frame 4:** a white flash at the tip, held 60 ms longer as a hit-stop (now 160 ms).\n- **Frames 5–7:** a 4 px ice-blue ring grows to about 46 px across, with ice shards flying out.\n- **Frames 7–8:** the ring breaks into dots as it fades.\n- **"
